name: Validate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  full-gates:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: calendar_test
          MYSQL_PASSWORD: calendar_test
          MYSQL_ROOT_PASSWORD: calendar_root_test
          MYSQL_USER: calendar_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ucalendar_test -pcalendar_test"
          --health-interval=2s
          --health-timeout=3s
          --health-retries=30

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.11.9'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.0'

      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install locked dependencies
        run: |
          npm ci
          python -m venv .venv-test
          .venv-test/bin/python -m pip install --require-hashes -r requirements-test.lock

      - name: Install fixed Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run source and contract gates
        env:
          PYTHONWARNINGS: error::DeprecationWarning
        run: |
          npm run format:check
          npm run lint
          npm run test:run
          npm run build
          npm run catalog:check
          npm run openapi:check
          npm run test:backend
          npm run rust:check
          pwsh -NoProfile -File scripts/check-version.ps1

      - name: Run isolated desktop E2E
        run: npm run test:e2e:desktop

      - name: Run real MySQL migration and contract tests
        env:
          CALENDAR_MYSQL_TEST_URL: mysql+pymysql://calendar_test:calendar_test@127.0.0.1:3306/calendar_test?charset=utf8mb4
        run: |
          node scripts/run-python.mjs -m alembic -x "database_url=$CALENDAR_MYSQL_TEST_URL" upgrade head
          node scripts/run-python.mjs -m unittest discover Office/test/backend -p "test_mysql_contract.py"

      - name: Run server authentication and isolation E2E
        env:
          CALENDAR_E2E_DATABASE_URL: mysql+pymysql://calendar_test:calendar_test@127.0.0.1:3306/calendar_test?charset=utf8mb4
        run: npm run test:e2e:server

      - name: Audit JavaScript dependencies
        run: npm audit --audit-level=high

      - name: Audit Python dependency locks
        run: |
          uvx --from pip-audit==2.10.1 pip-audit --no-deps --disable-pip -r requirements-server.lock
          uvx --from pip-audit==2.10.1 pip-audit --no-deps --disable-pip -r requirements-desktop.lock
          uvx --from pip-audit==2.10.1 pip-audit --no-deps --disable-pip -r requirements-test.lock

      - name: Upload E2E failure evidence
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: calendar-e2e-failure-evidence
          if-no-files-found: ignore
          path: |
            playwright-report/
            test-results/playwright-desktop/
            test-results/playwright-server/
            test-results/e2e-desktop/*.log
            test-results/e2e-server/*.log
          retention-days: 14
