# Include inside the existing HTTPS server for mantleofintelligence.com.
# Public URL: https://mantleofintelligence.com/calendar/
# Build with npm run build:server before enabling this snippet.
location = /calendar {
    return 308 /calendar/;
}

location = /calendar/api {
    return 308 /calendar/api/;
}

location ^~ /calendar/api/ {
    proxy_pass http://127.0.0.1:18787/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_cookie_path / /calendar/;
    proxy_read_timeout 300s;
    proxy_buffering off;
    proxy_cache off;
    client_max_body_size 25m;
    add_header Cache-Control "no-store" always;
}

location ^~ /calendar/assets/ {
    root /opt/projects/calendar-app-current/dist-server;
    try_files $uri =404;
}

location = /calendar/index.html {
    root /opt/projects/calendar-app-current/dist-server;
    add_header Cache-Control "no-cache" always;
}

location ^~ /calendar/ {
    root /opt/projects/calendar-app-current/dist-server;
    index index.html;
    try_files $uri $uri/ /calendar/index.html;
}
